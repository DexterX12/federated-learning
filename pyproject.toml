[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-regresion"
version = "1.0.0"
description = "Regresion lineal federada con Flower"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.26",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "demo"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
num-server-rounds = 5

[superlink]
default = "local-deployment"

[superlink.supergrid]
address = "api.flower.ai"

[superlink.local]
address = ":local:"

[superlink.local-deployment]
address = "127.0.0.1:8000"
insecure = true
